<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 960" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Sauerobase system landscape: the systems it reads from and writes to</title>
  <defs>
    <marker id="a-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#47482b"/></marker>
    <marker id="a-mail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9a6a2f"/></marker>
    <marker id="a-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#5b7a99"/></marker>
    <marker id="a-goods" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#8a8a7c"/></marker>
  </defs>

  <rect width="1480" height="960" fill="#fbfaf7"/>

  <!-- ── Systems ─────────────────────────────────────────────── -->
  <g font-size="15" fill="#66674e" text-anchor="middle">
    <!-- QuickBooks (paused) -->
    <rect x="40" y="60" width="290" height="90" rx="10" fill="#ffffff" stroke="#b9b2a4" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="185" y="98" font-size="23" font-weight="700" fill="#8a8a7c">QuickBooks</text>
    <text x="185" y="122">Accounting · connection paused</text>

    <!-- Shopify -->
    <rect x="540" y="60" width="360" height="90" rx="10" fill="#eef2e6" stroke="#6b7d4a" stroke-width="1.5"/>
    <text x="720" y="98" font-size="23" font-weight="700" fill="#47482b">Shopify</text>
    <text x="720" y="122">Online store · source of truth</text>

    <!-- SimplyDepo -->
    <rect x="1110" y="60" width="330" height="90" rx="10" fill="#ffffff" stroke="#dcd5c8" stroke-width="1.5"/>
    <text x="1275" y="98" font-size="23" font-weight="700" fill="#47482b">SimplyDepo</text>
    <text x="1275" y="122">B2B ordering portal for retailers</text>

    <!-- BlueBox -->
    <rect x="40" y="395" width="290" height="90" rx="10" fill="#ffffff" stroke="#dcd5c8" stroke-width="1.5"/>
    <text x="185" y="433" font-size="23" font-weight="700" fill="#47482b">BlueBox (3PL)</text>
    <text x="185" y="457">Warehouse · stock, batches, shipping</text>

    <!-- Folk -->
    <rect x="1110" y="395" width="330" height="90" rx="10" fill="#ffffff" stroke="#dcd5c8" stroke-width="1.5"/>
    <text x="1275" y="433" font-size="23" font-weight="700" fill="#47482b">Folk CRM</text>
    <text x="1275" y="457">Sales team's customer records</text>

    <!-- Manuel Brothers -->
    <rect x="540" y="720" width="360" height="90" rx="10" fill="#f7efe3" stroke="#9a6a2f" stroke-width="1.5"/>
    <text x="720" y="758" font-size="23" font-weight="700" fill="#7a5222">Manuel Brothers</text>
    <text x="720" y="782">Distributor · pickup &amp; delivery to stores</text>

    <!-- AI assistant -->
    <rect x="1110" y="720" width="330" height="90" rx="10" fill="#ffffff" stroke="#dcd5c8" stroke-width="1.5"/>
    <text x="1275" y="758" font-size="23" font-weight="700" fill="#47482b">AI assistant</text>
    <text x="1275" y="782">Claude, via the Sauero connector</text>
  </g>

  <!-- Sauerobase (centre) -->
  <g text-anchor="middle">
    <rect x="520" y="370" width="400" height="140" rx="12" fill="#47482b"/>
    <text x="720" y="418" font-size="27" font-weight="700" fill="#f2eee6">Sauerobase</text>
    <text x="720" y="446" font-size="15" fill="#dcd5c8">One view of orders, stock &amp; revenue</text>
    <text x="720" y="468" font-size="15" fill="#dcd5c8">Scheduled syncs · emails · document reading</text>
    <text x="720" y="490" font-size="15" fill="#dcd5c8">Demand planning · help center</text>
  </g>

  <!-- ── Sauero data flows (olive) ───────────────────────────── -->
  <g fill="none" stroke="#47482b" stroke-width="2">
    <!-- Shopify ⇄ Sauero -->
    <path d="M620 150 V366" marker-end="url(#a-data)"/>
    <path d="M760 370 V154" marker-end="url(#a-data)"/>
    <!-- SimplyDepo ⇄ Sauero (via Zapier connection) -->
    <path d="M840 370 V220 H1160 V154" marker-end="url(#a-data)"/>
    <path d="M1220 150 V265 H890 V366" marker-end="url(#a-data)"/>
    <!-- BlueBox ⇄ Sauero -->
    <path d="M520 415 H334" marker-end="url(#a-data)"/>
    <path d="M330 465 H516" marker-end="url(#a-data)"/>
    <!-- Folk ⇄ Sauero -->
    <path d="M920 415 H1106" marker-end="url(#a-data)"/>
    <path d="M1110 465 H924" marker-end="url(#a-data)"/>
    <!-- QuickBooks → Sauero (paused) -->
    <path d="M185 150 V300 H560 V366" stroke="#b9b2a4" stroke-dasharray="6 5" marker-end="url(#a-goods)"/>
    <!-- Sauero → AI assistant -->
    <path d="M880 510 V620 H1275 V716" marker-end="url(#a-data)"/>
  </g>
  <g font-size="15" fill="#47482b">
    <text x="610" y="235" text-anchor="end" font-weight="600">Orders, customers,</text>
    <text x="610" y="252" text-anchor="end">products, stock, traffic</text>
    <text x="690" y="290" text-anchor="middle" font-weight="600">Distributor</text>
    <text x="690" y="307" text-anchor="middle">stock updates</text>

    <text x="1000" y="210" text-anchor="middle" font-weight="600">Deliveries recorded (from proof of delivery)</text>
    <text x="1058" y="284" text-anchor="middle">Catalogue, order details, order PDFs</text>

    <text x="425" y="405" text-anchor="middle" font-weight="600">Pickup orders</text>
    <text x="425" y="490" text-anchor="middle">Stock, batches, inbound,</text>
    <text x="425" y="506" text-anchor="middle">shipments, tracking</text>

    <text x="1015" y="405" text-anchor="middle" font-weight="600">Order metrics</text>
    <text x="1015" y="490" text-anchor="middle">Companies, status,</text>
    <text x="1015" y="506" text-anchor="middle">last contact</text>

    <text x="372" y="292" text-anchor="middle" fill="#8a8a7c">Accounting data (paused)</text>
    <text x="1080" y="610" text-anchor="middle">Answers questions · read-only</text>
  </g>

  <!-- ── Email (amber) — through the shared Gmail inbox ──────── -->
  <g fill="none" stroke="#9a6a2f" stroke-width="2">
    <path d="M660 510 V716" marker-end="url(#a-mail)"/>
    <path d="M780 720 V514" marker-end="url(#a-mail)"/>
  </g>
  <g font-size="15" fill="#7a5222">
    <text x="650" y="590" text-anchor="end" font-weight="600">Email out:</text>
    <text x="650" y="607" text-anchor="end">pickup requests,</text>
    <text x="650" y="624" text-anchor="end">new order details</text>
    <text x="792" y="664" font-weight="600">Email in (shared inbox):</text>
    <text x="792" y="681">replies, pickup confirmations,</text>
    <text x="792" y="698">proof of delivery</text>
  </g>

  <!-- ── Their own integrations (blue, dashed) ───────────────── -->
  <g fill="none" stroke="#5b7a99" stroke-width="2" stroke-dasharray="7 5">
    <path d="M1110 88 H904" marker-end="url(#a-ext)"/>
    <path d="M900 124 H1106" marker-end="url(#a-ext)"/>
    <path d="M1390 150 V391" marker-end="url(#a-ext)"/>
  </g>
  <g font-size="15" fill="#5b7a99">
    <text x="1005" y="80" text-anchor="middle" font-weight="600">B2B orders</text>
    <text x="1005" y="143" text-anchor="middle">Stock levels</text>
    <text x="1400" y="255" font-weight="600">New</text>
    <text x="1400" y="272" font-weight="600">customers</text>
    <text x="1400" y="289">(Zapier)</text>
  </g>

  <!-- ── Physical goods (grey, dashed) ───────────────────────── -->
  <g fill="none" stroke="#8a8a7c" stroke-width="2" stroke-dasharray="4 5">
    <path d="M185 485 V765 H536" marker-end="url(#a-goods)"/>
    <path d="M720 810 V868" marker-end="url(#a-goods)"/>
  </g>
  <g font-size="15" fill="#66674e" font-style="italic">
    <text x="200" y="640">Goods collected</text>
    <text x="200" y="657">from the warehouse</text>
    <text x="735" y="850">Delivered to retail stores</text>
  </g>

  <!-- ── Legend ──────────────────────────────────────────────── -->
  <g font-size="15" fill="#47482b">
    <line x1="40" y1="915" x2="80" y2="915" stroke="#47482b" stroke-width="2"/>
    <text x="90" y="920">Sauerobase reads or writes</text>
    <line x1="300" y1="915" x2="340" y2="915" stroke="#9a6a2f" stroke-width="2"/>
    <text x="350" y="920">Email</text>
    <line x1="420" y1="915" x2="460" y2="915" stroke="#5b7a99" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="470" y="920">Other integrations (not Sauerobase)</text>
    <line x1="740" y1="915" x2="780" y2="915" stroke="#8a8a7c" stroke-width="2" stroke-dasharray="4 5"/>
    <text x="790" y="920">Physical goods</text>
    <rect x="920" y="905" width="40" height="20" rx="4" fill="#ffffff" stroke="#b9b2a4" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="970" y="920">Paused</text>
  </g>
</svg>
